name: Check Docs
# Validates documentation completeness on every PR. Docstring and
# mod-declaration checks require the botforge-services source, which is not
# part of this repository; the checkout is mandatory (fail-closed) —
# partial validation is refused. Generated technical docs (pydoc) live in
# botforge-services itself and are freshness-checked there.
on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the botforge-services ref matching this branch
        run: |
          # Branch-adaptive source ref: if botforge-services carries a branch
          # with the same name, document that one; otherwise fall back to main.
          CANDIDATE_REF="${GITHUB_HEAD_REF:-main}"
          if git ls-remote --exit-code --heads \
            "https://github.com/jj-guild/botforge-services.git" \
            "${CANDIDATE_REF}" >/dev/null 2>&1; then
            echo "SERVICES_REF=${CANDIDATE_REF}" >> "$GITHUB_ENV"
          else
            echo "SERVICES_REF=main" >> "$GITHUB_ENV"
          fi
      - name: Checkout botforge-services (read-only)
        uses: actions/checkout@v4
        with:
          repository: jj-guild/botforge-services
          ref: ${{ env.SERVICES_REF }}
          path: botforge-services
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check documentation completeness
        run: |
          python .github/workflows/scripts/validate_docs.py --check \
            --source botforge-services/src/botforge \
            --config botforge-services/config
